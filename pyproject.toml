[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "print3d"
version = "0.1.0"
description = "Idea to a reviewable Bambu Studio project for a Bambu Lab X2D or P2S"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1,<14", "mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
print3d = "print3d.cli:main"

[tool.setuptools]
packages = ["print3d", "print3d.skill"]
include-package-data = false  # All bundled resources are listed below.

[tool.setuptools.package-dir]
"" = "src"
"print3d.skill" = "skills/print3d"

[tool.setuptools.package-data]
print3d = ["profiles/*/*", "coupons/*.py"]
"print3d.skill" = ["*.md", "references/*.md"]

[tool.uv]
# `uvx --from <checkout>` (the Hermes plugin's mcp.json) rebuilds when the code changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "skills/**/*.md" }, { file = "src/**/*.json" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
